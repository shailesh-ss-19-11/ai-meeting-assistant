<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Assistant</title><style>body{font:14px system-ui;width:320px;padding:16px;background:#151722;color:#eee}h1{font-size:16px}p{font-size:12px;color:#aaa;line-height:1.5}label{display:block;font-size:11px;margin:12px 0 5px}input,textarea{box-sizing:border-box;width:100%;padding:10px;border-radius:8px;background:#202331;border:1px solid #393d4b;color:#fff}textarea{height:120px;resize:vertical}button{margin-top:9px;width:100%;padding:10px;background:#7568ed;color:white;border:0;border-radius:7px;cursor:pointer}button.secondary{background:#292c3a}#status{min-height:16px}</style></head><body><h1>Meeting context</h1><p>Use the same bridge token configured in server/.env and the desktop assistant. Context stays on this computer and syncs through the local server.</p><label for="token">Bridge token</label><input id="token" type="password" autocomplete="off" placeholder="Your private BRIDGE_TOKEN"><label for="context">Recent discussion and notes</label><textarea id="context" placeholder="Decisions, questions, or follow-ups…"></textarea><button id="send">Send to desktop</button><button id="copy" class="secondary">Copy context</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
